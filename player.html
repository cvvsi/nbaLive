<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sixth Man">
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)">
<title>Player Log · Sixth Man</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* One player, current season: averages for the chosen range up top, then one card per game, in
   the same style as the player page's "Last 5 games" in index.html. Tokens, stat order, green /
   red thresholds and punts are copied from index.html - keep them in sync. */
:root{
  --bg:#f4f5f2;        /* gym-floor grey, faint green bias */
  --panel:#ffffff;
  --ink:#141613;
  --dim:#6b7069;
  --rule:#dfe2dc;
  --cell:#eceee9;
  --ball:#d9530f;      /* basketball orange: the only accent */
  --pos:#178a4c;
  --neg:#c9372c;
  --name:"Archivo Narrow","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bar:48px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121311; --panel:#1a1c19; --ink:#e9ebe6; --dim:#8a9087; --rule:#2a2d28; --cell:#232621;
  --ball:#f07a36; --pos:#3cc77d; --neg:#f2675b; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.35 var(--name);-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:20}
button,a{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin-inline:auto}

/* top bar: back + who this is */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:var(--bar);background:var(--panel);
  border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.back{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);
  font:600 20px/1 var(--name);color:var(--ink)}
.hdr{display:flex;align-items:center;gap:9px;min-width:0}
.hdr i{width:32px;height:32px;border-radius:50%;background:var(--cell);overflow:hidden;flex:none;display:block}
.hdr img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.hdr img.bad{visibility:hidden}
.hdr .nm{min-width:0}
.hdr b{font:700 16px/1.1 var(--name);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr span{font:500 12px/1.2 var(--name);color:var(--dim);display:block;margin-top:2px}

/* sections */
.blk{margin-top:18px}
.blk>h3{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 8px;font:700 15px/1 var(--name)}
.blk>h3 span{font:500 12px/1 var(--name);color:var(--dim)}
.card{background:var(--panel);border-radius:10px;padding:12px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{font:600 13px/1 var(--name);padding:8px 14px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:disabled{opacity:.35;cursor:default}

/* numbers: big PTS REB AST, small 3PM..FT, role in grey (as on the player page) */
.bign{display:flex;align-items:baseline;gap:16px}
.bg{display:flex;align-items:baseline;gap:2px;white-space:nowrap}
.bg b{font:700 25px/1 var(--name);letter-spacing:-.01em}
.bg i,.sm i{font-style:normal;color:var(--dim)}
.bg i{font:500 13px/1 var(--name)}
.bign .bg b{font-size:36px}.bign .bg i{font-size:15px}
.vlb{margin-left:auto;text-align:right}
.vlb i{display:block;font:600 9.5px/1 var(--name);letter-spacing:.08em;font-style:normal;color:var(--dim)}
.vlb b{font:600 18px/1.3 var(--num)}
.sg{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:12px}
.sg div b{display:block;font:600 18px/1 var(--name)}
.sg div i{display:block;margin-top:3px;font:600 10px/1.2 var(--name);letter-spacing:.06em;font-style:normal;color:var(--dim)}
.sg div i em{font:500 10.5px/1 var(--num);font-style:normal;letter-spacing:0}
.sg .role b{color:var(--dim)}
.vl{font:600 13px/1 var(--num)}
.vl.good,.bg.good>b,.sm.good>b,.sg .good>b{color:var(--pos)}.vl.bad,.bg.bad>b,.sm.bad>b,.sg .bad>b{color:var(--neg)}
.off{opacity:.38}.off b{text-decoration:line-through;text-decoration-thickness:1px}

/* one row per game */
.gl{background:var(--panel);border-radius:10px;padding:2px 12px}
.glr{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.glr:last-child{border-bottom:0}
.gd b{display:block;font:600 14px/1 var(--name)}
.gd i{display:block;margin-top:3px;font:500 11.5px/1.2 var(--name);font-style:normal;color:var(--dim)}
.gd .w{color:var(--pos)}.gd .l{color:var(--neg)}
.gd .bo{display:inline-block;margin-top:4px;font:600 9px/1 var(--name);text-transform:uppercase;letter-spacing:.07em;
  color:var(--dim);border:1px solid var(--rule);border-radius:3px;padding:2px 4px}
.c2{display:flex;align-items:flex-end;gap:10px}
.bigs{display:flex;align-items:baseline;gap:13px;min-width:0}
.gs .bg b{font-size:21px}
.c3{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 11px;margin-top:6px}
.sm{display:flex;align-items:baseline;gap:2px;white-space:nowrap}
.sm b{font:500 13px/1 var(--num)}
.sm i{font:500 12px/1 var(--name)}
.sm.good b,.sm.bad b{font-weight:600}

.msg{padding:40px 14px;color:var(--dim);text-align:center;font-size:15px}
.msg.err{color:var(--neg)}
.foot{padding-block:14px 30px;font:500 11.5px/1.5 var(--name);color:var(--dim);max-width:62ch}
</style>
</head>
<body>
<div class="bar gut">
  <a class="back" href="./" id="back" aria-label="Back">&lsaquo;</a>
  <div class="hdr" id="hdr"></div>
</div>

<main class="gut">
  <section class="blk" id="avgBlk" hidden>
    <h3><span class="seg" id="rangeSeg"><button data-n="5">L5</button><button data-n="10" aria-pressed="true">L10</button><button data-n="20">L20</button><button data-n="0">Season</button></span><span id="span"></span></h3>
    <div class="card" id="avg"></div>
  </section>
  <section class="blk" id="logBlk" hidden><h3>Games <span>newest first</span></h3><div class="gl" id="log"></div></section>
  <div id="msg"></div>
  <div class="foot" id="foot"></div>
</main>

<script>
// Same 9 categories as index.html. Display order everywhere: PTS REB AST big, then 3PM STL BLK TO
// FG FT, then MIN. Punts come from the main page (same localStorage key).
const CATS=[
  {k:"fg",l:"FG%"},{k:"ft",l:"FT%"},{k:"tpm",l:"3PM"},{k:"pts",l:"PTS"},
  {k:"reb",l:"REB"},{k:"ast",l:"AST"},{k:"stl",l:"STL"},{k:"blk",l:"BLK"},{k:"to",l:"TO"}];
const BIG=["pts","reb","ast"],SMALL=["tpm","stl","blk","to","fg","ft"];
const CL={pts:"pts",reb:"reb",ast:"ast",tpm:"3pm",stl:"stl",blk:"blk",to:"to",fg:"fg",ft:"ft"};
const HI={pts:25,reb:8,ast:8,tpm:4,stl:3,blk:3};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}};
const S={id:null,games:[],n:10,info:null,punt:new Set(store.get("punt",[]))};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sgn=(v,d=2)=>(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d);
const f1=v=>v.toFixed(1);
const nh=k=>S.punt.has(k)?" off":"";
// A big or bad single game, by plain fantasy thresholds (same as index.html's cards).
function hl(k,o){
  if(S.punt.has(k))return" off";
  if(k==="to")return o.to>=4?" bad":"";
  if(k==="fg"){const p=o.fga?o.fgm/o.fga:0;return o.fga>=10&&p>=.6?" good":o.fga>=12&&p<=.35?" bad":""}
  if(k==="ft"){const p=o.fta?o.ftm/o.fta:0;return o.fta>=4&&p>=.9?" good":o.fta>=4&&p<.6?" bad":""}
  return o[k]>=HI[k]?" good":"";
}
const vcls=v=>v>=1?"good":v<=-1?"bad":"";
const valueOf=z=>{const a=CATS.filter(c=>!S.punt.has(c.k));return a.length?a.reduce((s,c)=>s+z[c.k],0)/a.length:0};

const WEB="https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/athletes";
const getJSON=async u=>{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()};

// League-average rates for the percentage impact terms. These are the stable
// season-long numbers; z-scores here are per-game against a fixed league shape
// rather than against one night's pool, because a game log spans many nights.
const LG={fg:.470,ft:.785,
  mean:{pts:11.2,tpm:1.3,reb:4.4,ast:2.6,stl:.7,blk:.5,to:1.3,fgi:0,fti:0},
  sd:{pts:7.9,tpm:1.4,reb:3.1,ast:2.3,stl:.8,blk:.7,to:1.1,fgi:2.6,fti:1.3}};

const split=s=>{const[m,a]=String(s||"0-0").split("-").map(Number);return[m||0,a||0]};

function parseLog(j){
  const names=j.names||[],out=[];
  const ix=n=>names.indexOf(n);
  const I={min:ix("minutes"),fg:ix("fieldGoalsMade-fieldGoalsAttempted"),
    tp:ix("threePointFieldGoalsMade-threePointFieldGoalsAttempted"),
    ft:ix("freeThrowsMade-freeThrowsAttempted"),reb:ix("totalRebounds"),
    ast:ix("assists"),blk:ix("blocks"),stl:ix("steals"),pf:ix("fouls"),
    to:ix("turnovers"),pts:ix("points")};
  for(const st of j.seasonTypes||[]){
    // Current season regular season only - preseason rotations say nothing about
    // real roles, and ESPN already separates them for us.
    if(!/Regular Season/i.test(st.displayName)||/Preseason/i.test(st.displayName))continue;
    for(const cat of st.categories||[]){
      for(const ev of cat.events||[]){
        const s=ev.stats||[],meta=(j.events||{})[ev.eventId]||{};
        const min=parseFloat(s[I.min])||0;
        const [fgm,fga]=split(s[I.fg]),[tpm]=split(s[I.tp]),[ftm,fta]=split(s[I.ft]);
        const hs=+meta.homeTeamScore||0,as=+meta.awayTeamScore||0;
        out.push({eid:ev.eventId,date:meta.gameDate||"",
          opp:(meta.opponent||{}).abbreviation||"",at:meta.atVs||"vs",
          res:meta.gameResult||"",score:meta.score||"",
          margin:Math.abs(hs-as),
          min,pts:+s[I.pts]||0,reb:+s[I.reb]||0,ast:+s[I.ast]||0,stl:+s[I.stl]||0,
          blk:+s[I.blk]||0,to:+s[I.to]||0,pf:+s[I.pf]||0,fgm,fga,tpm,ftm,fta});
      }
    }
  }
  out.sort((a,b)=>(b.date>a.date?1:b.date<a.date?-1:0));   // newest first
  for(const g of out){
    g.fgi=g.fgm-LG.fg*g.fga; g.fti=g.ftm-LG.ft*g.fta;
    g.z={};
    const src={pts:"pts",tpm:"tpm",reb:"reb",ast:"ast",stl:"stl",blk:"blk",fg:"fgi",ft:"fti",to:"to"};
    for(const c of CATS){const k=src[c.k];
      g.z[c.k]=(c.k==="to"?-1:1)*((g[k]-LG.mean[k])/LG.sd[k])}
  }
  return out;
}

function avgOf(gs){
  if(!gs.length)return null;
  const n=gs.length,s=k=>gs.reduce((a,g)=>a+g[k],0);
  const o={g:n,min:s("min")/n,pts:s("pts")/n,tpm:s("tpm")/n,reb:s("reb")/n,ast:s("ast")/n,
    stl:s("stl")/n,blk:s("blk")/n,to:s("to")/n,
    fgm:s("fgm"),fga:s("fga"),ftm:s("ftm"),fta:s("fta"),
    starts:0};
  o.fgi=(o.fgm-LG.fg*o.fga)/n; o.fti=(o.ftm-LG.ft*o.fta)/n;
  o.z={};
  const src={pts:"pts",tpm:"tpm",reb:"reb",ast:"ast",stl:"stl",blk:"blk",fg:"fgi",ft:"fti",to:"to"};
  for(const c of CATS){const k=src[c.k];
    o.z[c.k]=(c.k==="to"?-1:1)*((o[k]-LG.mean[k])/LG.sd[k])}
  return o;
}

function fmtDate(iso){
  if(!iso)return"";
  const d=new Date(iso);
  return isNaN(d)?"":(d.getMonth()+1)+"/"+d.getDate();
}

function render(){
  const all=S.games, n=S.n||all.length, gs=all.slice(0,n);
  $("avgBlk").hidden=false; $("logBlk").hidden=false; $("msg").innerHTML="";
  $("rangeSeg").querySelectorAll("button").forEach(b=>{
    const v=+b.dataset.n;
    b.setAttribute("aria-pressed",v===S.n);
    b.disabled=v>0&&v>all.length;       // don't offer L20 when there are 4 games
  });
  for(const g of all)g.value=valueOf(g.z);
  const a=avgOf(gs);a.value=gs.reduce((s,g)=>s+g.value,0)/gs.length;
  $("span").textContent=`per game · ${gs.length} of ${all.length} game${all.length===1?"":"s"}`;
  const pc=(m,t)=>t?(m/t*100).toFixed(1)+"%":"–";
  $("avg").innerHTML=`<div class="bign">${BIG.map(k=>`<span class="bg${nh(k)}"><b>${f1(a[k])}</b><i>${CL[k]}</i></span>`).join("")}
      <span class="vlb"><i>VALUE</i><b class="vl ${vcls(a.value)}">${sgn(a.value)}</b></span></div>
    <div class="sg">${SMALL.map(k=>{
      const v=k==="fg"?pc(a.fgm,a.fga):k==="ft"?pc(a.ftm,a.fta):f1(a[k]);
      const att=k==="fg"?` <em>${f1(a.fga/a.g)} att</em>`:k==="ft"?` <em>${f1(a.fta/a.g)} att</em>`:"";
      return`<div class="${nh(k).trim()}"><b>${v}</b><i>${CL[k].toUpperCase()}${att}</i></div>`}).join("")}
      <div class="role"><b>${f1(a.min)}</b><i>MIN</i></div></div>`;

  $("log").innerHTML=gs.map(g=>{
    const r=(g.res||"").toLowerCase();
    const cats=["tpm","stl","blk","to"].map(k=>`<span class="sm${hl(k,g)}"><b>${g[k]}</b><i>${CL[k]}</i></span>`).join("")
      +`<span class="sm${hl("fg",g)}"><b>${g.fgm}/${g.fga}</b><i>fg</i></span><span class="sm${hl("ft",g)}"><b>${g.ftm}/${g.fta}</b><i>ft</i></span>`;
    return`<div class="glr"><div class="gd"><b>${fmtDate(g.date)}</b><i>${g.at==="@"?"@":"vs"} ${esc(g.opp)}</i>
        <i><span class="${r==="w"?"w":r==="l"?"l":""}">${esc(g.res)}</span> ${esc(g.score)}</i><i>${Math.round(g.min)} min</i>
        ${g.margin>=20?'<span class="bo" title="Decided by 20+">blowout</span>':""}</div>
      <div class="gs"><div class="c2"><div class="bigs">${BIG.map(k=>`<span class="bg${hl(k,g)}"><b>${g[k]}</b><i>${CL[k]}</i></span>`).join("")}</div>
        <span class="vl ${vcls(g.value)}" style="margin-left:auto">${sgn(g.value)}</span></div><div class="c3">${cats}</div></div></div>`}).join("");

  $("foot").textContent=
    "Value is the mean of the category z-scores (punts from the main page left out), scored against "
   +"season-long league averages rather than one night's pool, so games from different dates compare. "
   +"Green and red mark a big or bad game by plain fantasy thresholds, as on the main page. Blowout = "
   +"decided by 20 or more. Current regular season only.";
}

function renderHdr(info,id){
  const u=`https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/${id}.png&w=60&h=60&scale=crop`;
  $("hdr").innerHTML=
    `<i><img src="${u}" alt="" width="30" height="30" onerror="this.classList.add('bad')"></i>`
   +`<div class="nm"><b>${esc(info.name)}</b><span>${esc(info.team)}${info.pos?" · "+esc(info.pos):""}</span></div>`;
  document.title=info.name+" · Sixth Man";
}

function fail(msg){$("msg").innerHTML=`<div class="msg err">${esc(msg)}</div>`}

async function load(){
  const q=new URLSearchParams(location.search);
  const id=q.get("id");
  if(!id)return fail("No player id. Open this page by tapping a player on the box score.");
  S.id=id;
  if(q.get("name"))renderHdr({name:q.get("name"),team:q.get("team")||"",pos:q.get("pos")||""},id);
  $("msg").innerHTML='<div class="msg">Loading game log…</div>';
  let log,ath;
  try{
    [log,ath]=await Promise.all([
      getJSON(`${WEB}/${encodeURIComponent(id)}/gamelog`),
      getJSON(`${WEB}/${encodeURIComponent(id)}`).catch(()=>null)
    ]);
  }catch(e){return fail("Couldn't load this player's game log from ESPN. Check your connection and reload.")}
  if(ath){const a=ath.athlete||ath;
    renderHdr({name:a.displayName||q.get("name")||"Player",
      team:(a.team||{}).abbreviation||q.get("team")||"",
      pos:(a.position||{}).abbreviation||q.get("pos")||""},id)}
  S.games=parseLog(log);
  if(!S.games.length){
    $("avgBlk").hidden=true;$("logBlk").hidden=true;
    return fail("No regular-season games yet this season.");
  }
  if(S.games.length<S.n)S.n=S.games.length>=5?5:0;
  render();
}

$("rangeSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(!b.disabled){S.n=+b.dataset.n;render()}});
// Back: return to wherever the page was opened from (the player sheet), else the main page.
$("back").onclick=e=>{if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){e.preventDefault();history.back()}};
load();
</script>
</body>
</html>
