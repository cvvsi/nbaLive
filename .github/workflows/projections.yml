# Daily pull of EFB's and BBM's rest-of-season projections (proj-pull.js): signs in to each site
# with your own logins (BBM_USER / BBM_PASS, EFB_USER / EFB_PASS repo secrets) in a headless
# browser, reads the projections table and sends it to your relay (kept in its KV storage behind
# RELAY_KEY). Nothing is committed and the log shows only steps, labels and row counts: the repo
# and its logs are public, and both sites are paid.
name: Projections

on:
  schedule:
    - cron: '47 13 * * *'   # 8:47am ET (backup; cron-job.org calls it on time)
  workflow_dispatch:
    inputs:
      site:
        description: Which site
        type: choice
        options: [both, bbm, efb]
        default: both
      dry:
        description: Read only, send nothing to the relay
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          # the runner's own Chrome needs no download; only without it fetch Playwright's
          command -v google-chrome >/dev/null || npx playwright install --with-deps chromium
      - name: Sign in, read, send to the relay
        env:
          SITE: ${{ inputs.site || 'both' }}
          DRY: ${{ inputs.dry && '1' || '' }}
          BBM_USER: ${{ secrets.BBM_USER }}
          BBM_PASS: ${{ secrets.BBM_PASS }}
          EFB_USER: ${{ secrets.EFB_USER }}
          EFB_PASS: ${{ secrets.EFB_PASS }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: node proj-pull.js
