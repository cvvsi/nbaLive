# Temporary (clips prototype): which NBA.com endpoints answer GitHub's servers, and their CORS headers.
name: NBA probe
on:
  push:
    branches: [claude/magical-gates-x571f7]
    paths: [.github/workflows/nba-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          p() { echo "== $1"; curl -s -m 15 -o /tmp/b -D - -A "$UA" -H "Origin: https://cvvsi.github.io" "${@:2}" "$1" | grep -iE '^(HTTP|access-control-allow-origin|content-type|content-length)' ; echo "body: $(head -c 300 /tmp/b | tr -d '\n')"; }
          p https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_0022600260.json
          p https://cdn.nba.com/static/json/staticData/scheduleLeagueV2_1.json -r 0-200
          p "https://stats.nba.com/stats/scoreboardv3?LeagueID=00&GameDate=2026-11-18"
          N=(-H "Referer: https://www.nba.com/" -H "x-nba-stats-origin: stats" -H "x-nba-stats-token: true")
          p "https://stats.nba.com/stats/videoeventsasset?GameID=0022600260&GameEventID=627" "${N[@]}"
          MP4=$(grep -oE '"lurl":"[^"]+' /tmp/b | cut -d'"' -f4); echo "mp4: $MP4"
          [ -n "$MP4" ] && p "$MP4" -r 0-1023 -H "Referer: https://cvvsi.github.io/"
          echo "== nba.com event page"; curl -s -m 15 -o /dev/null -w "%{http_code}\n" -A "$UA" "https://www.nba.com/stats/events?GameEventID=627&GameID=0022600260&Season=2026-27&flag=1"
