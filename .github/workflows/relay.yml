# Deploys the private Yahoo relay (worker/yahoo-relay.js) to Cloudflare and sets its secrets from
# the repo secrets. Run it once to set up, again after a Yahoo login (new token) or a new client
# secret, and after changing worker/. Needs repo secrets CLOUDFLARE_API_TOKEN (template "Edit
# Cloudflare Workers") and RELAY_KEY (your passphrase, 16+ characters), plus
# the YAHOO_* ones. Logs show no secrets: the secrets file goes to a temp path and is deleted.
name: Yahoo relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy the Worker
        run: npx --yes wrangler@4 deploy --config worker/wrangler.toml

      - name: Set its secrets
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_LEAGUE_ID: ${{ secrets.YAHOO_LEAGUE_ID }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          f="$RUNNER_TEMP/relay-secrets.json"
          node worker/secrets.js > "$f"
          npx --yes wrangler@4 secret bulk "$f" --config worker/wrangler.toml
          rm -f "$f"
          echo "Relay ready: https://sixthman-yahoo.saac-choi.workers.dev"

      - name: Check a real sync (counts only)
        env:
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: node worker/smoke.js
