# Yahoo's public Buzz Index (most added / dropped across Yahoo leagues).
# Runs on its own so it doesn't wait on the nightly rankings, and it runs on days with no games,
# when adds and drops still move (injury returns, news). Each run pulls yesterday (final) and
# today so far, and commits data/buzz.json only if it changed. The push redeploys Pages.
name: Buzz

on:
  # The real trigger is cron-job.org (see README, "Scheduling"): 4:37, 5:37 and 6:37am ET,
  # after Yahoo's ~3am waivers, then 12:37 and 3:37pm. The same times stay here as a backup
  # (UTC = ET in winter). The Rankings and Props jobs pull the buzz too.
  schedule:
    - cron: "37 9,10,11,17,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buzz
  cancel-in-progress: false

jobs:
  buzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node fetch-buzz.js

      - name: Commit if changed
        run: |
          git add data/buzz.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Buzz $(node -p "const j=require('./data/buzz.json');j.date+(j.today?' + '+j.today.date+' so far':'')")"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*4)); done; exit 1
