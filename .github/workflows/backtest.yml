# Fits Proj's blend constants over the last 3 seasons (backtest.js). Manual only. The first run
# fetches five seasons of box scores (~6,000, 15-25 minutes); they're cached for later runs.
name: Backtest

on:
  workflow_dispatch:
    inputs:
      script:
        description: "backtest.js (Proj blend constants), backtest-injury.js (minutes when a regular is out) or backtest-absence.js (long absences) or backtest-return.js (ramp-up after a return) or backtest-rookie.js (players with no baseline) or study-breakout.js (breakout case study) or study-signs.js (every breakout and each sign's hit rate) or backtest-change.js (when a change is real: same player vs changed player) or backtest-tracking.js (tracking stats vs the box score; needs data/tracking-history.json from fetch-tracking.py) or backtest-minutes.js (recent games vs season vs last season for minutes) or backtest-ease.js (matchup ease: how much of each opponent effect to believe)"
        default: backtest.js
        required: true

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            .cache/season-*.json
          key: seasons-v1-${{ github.run_id }}
          restore-keys: seasons-v1-
      - run: node ${{ inputs.script || 'backtest.js' }} 2> fetch.log
      - run: tail -5 fetch.log
        if: always()
      - name: Commit the summary
        run: |
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Backtest summary"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*4)); done; exit 1
