# Rebuild data/rankings.json every morning after the night's games are final, and commit it.
# The push redeploys GitHub Pages, so the box score's rank columns pick it up on next load.
name: Rankings

on:
  # GitHub delays scheduled runs badly at the top of the hour (this one ran 6-10 h late at
  # "0 10"), so use odd minutes and three tries. Each run only commits if something changed,
  # and unfinished games are skipped and picked up by the next try. Times are ET in winter
  # (an hour later during daylight time): 1:23, 2:41 and 3:53am, all before the 4:39am report.
  schedule:
    - cron: "23 6 * * *"
    - cron: "41 7 * * *"
    - cron: "53 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rankings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Finished box scores never change, so keep them between runs; only new games are fetched.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: games-${{ github.run_id }}
          restore-keys: games-

      - run: node build-rankings.js

      # Remaining regular-season schedule for the Proj tab (games left, games this week).
      - name: Schedule
        continue-on-error: true
        run: node build-schedule.js

      # Yahoo's Buzz Index too: the 08:53 UTC try lands just after Yahoo's ~3am ET waivers.
      - name: Yahoo buzz
        continue-on-error: true
        run: node fetch-buzz.js

      # My Yahoo league: rosters, free agents, league moves, most added/dropped.
      # Skips itself when the secrets aren't set, and a Yahoo failure never blocks the rankings.
      - name: Yahoo league
        continue-on-error: true
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_LEAGUE_ID: ${{ secrets.YAHOO_LEAGUE_ID }}
        run: node fetch-yahoo.js

      - name: Commit if changed
        run: |
          git add data/rankings.json data/regression.json
          for f in data/buzz.json data/schedule.json data/injuries.json data/yahoo.json data/yahoo-owned.json data/yahoo-token.enc; do [ -f "$f" ] && git add "$f"; done; true
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rankings through $(node -p "require('./data/rankings.json').asOf")"
          git pull --rebase
          git push
